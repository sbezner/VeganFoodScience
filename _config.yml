title: "The Plant Lab"
tagline: "An open curriculum in vegan food science"
description: "An open, hands-on curriculum that teaches the chemistry, biology, and craft behind plant-based food — from amino acids to fermentation, texturization, and the future of cultivated foods."
author: "The Plant Lab"

# IMPORTANT: For a GitHub project page (sbezner.github.io/VeganFoodScience/)
# baseurl MUST match the repo name (case-sensitive) so that asset and link
# paths produced by `relative_url` resolve correctly.
# If you fork or rename the repo, update both fields.
baseurl: "/VeganFoodScience"
url: "https://sbezner.github.io"

markdown: kramdown
highlighter: rouge
permalink: pretty

# Course-level metadata used by templates
course:
  duration_weeks: 12
  estimated_hours: 60
  level: "Beginner → Intermediate"

modules:
  - id: m01
    num: "01"
    slug: foundations
    title: "Foundations of Plant-Based Food Chemistry"
    summary: "What food is — at the molecular level. Macromolecules, water activity, and the lens of food science."
    duration: "4 hours"
    topics: ["macromolecules", "water activity", "scientific method"]
  - id: m02
    num: "02"
    slug: proteins
    title: "Plant Proteins: The Building Blocks"
    summary: "Legumes, grains, and novel sources. Amino acid scoring, protein isolation, and texturization fundamentals."
    duration: "5 hours"
    topics: ["legumes", "amino acids", "isolation", "PDCAAS"]
  - id: m03
    num: "03"
    slug: fats
    title: "Fats, Oils, and Plant Lipids"
    summary: "Saturation, smoke points, emulsions, and engineering fat-like mouthfeel without animal fats."
    duration: "5 hours"
    topics: ["lipids", "emulsions", "smoke point", "cocoa butter"]
  - id: m04
    num: "04"
    slug: carbs-hydrocolloids
    title: "Carbohydrates, Starches, and Hydrocolloids"
    summary: "Gelatinization, retrogradation, and the wizardry of pectin, agar, xanthan, and methylcellulose."
    duration: "5 hours"
    topics: ["starch", "gels", "thickeners", "binders"]
  - id: m05
    num: "05"
    slug: fermentation
    title: "The Art and Science of Fermentation"
    summary: "Tempeh, miso, koji, and modern vegan cheese — wielding microbes to build flavor and texture."
    duration: "6 hours"
    topics: ["lactic acid", "koji", "tempeh", "vegan cheese"]
  - id: m06
    num: "06"
    slug: texturization
    title: "Texturization Technologies"
    summary: "Extrusion, shear cell, mycelium, and 3D printing — how plants get bite, grain, and chew."
    duration: "5 hours"
    topics: ["extrusion", "HMMA", "mycelium", "fibers"]
  - id: m07
    num: "07"
    slug: flavor
    title: "Flavor and Sensory Science"
    summary: "Maillard chemistry, the umami toolbox, and taming the off-notes of plant proteins."
    duration: "5 hours"
    topics: ["Maillard", "umami", "off-notes", "panels"]
  - id: m08
    num: "08"
    slug: eggs-dairy
    title: "Replacing Eggs and Dairy"
    summary: "Aquafaba foams, plant milks, vegan butters, and the functional roles you must replace."
    duration: "5 hours"
    topics: ["aquafaba", "plant milk", "butter", "cheese"]
  - id: m09
    num: "09"
    slug: nutrition
    title: "Nutrition and Bioavailability"
    summary: "Complete proteins, B12, iron, omega-3s, and the science of fortification done well."
    duration: "5 hours"
    topics: ["B12", "iron", "omega-3", "fortification"]
  - id: m10
    num: "10"
    slug: sustainability
    title: "Sustainability and Food Systems"
    summary: "Life-cycle assessment, planetary boundaries, and where plant-based food fits in a fed world."
    duration: "4 hours"
    topics: ["LCA", "land use", "policy", "supply chain"]
  - id: m11
    num: "11"
    slug: frontier
    title: "The Frontier: Precision Fermentation, Cellular Ag & 3D Printing"
    summary: "Where the field is going next — and what \"vegan\" means when food is grown in a bioreactor."
    duration: "5 hours"
    topics: ["precision fermentation", "mycelium", "3D printing"]
  - id: m12
    num: "12"
    slug: capstone
    title: "Capstone: Design a Plant-Based Product"
    summary: "Synthesize everything: a brief, a formulation, a kitchen prototype, and a product story."
    duration: "6 hours"
    topics: ["formulation", "ideation", "prototype", "storytelling"]

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
